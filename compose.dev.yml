# Local development services. The app itself runs on the host with `npm run dev`.
name: tripsplit-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripsplit
      POSTGRES_PASSWORD: tripsplit
      POSTGRES_DB: tripsplit
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsplit -d tripsplit"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Catches all outgoing email; view it at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
